id = "herdr-voice.desk-alerts"
name = "Desk alerts"
version = "0.6.0"
min_herdr_version = "0.9.3"
description = "Tell Vux when agents and workspaces change, push when an agent finishes or stops on a question while you're away, and name desk agents for their first task."
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.closed"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.exited"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.moved"
command = ["python3", "desk_alert.py"]

[[events]]
on = "workspace.created"
command = ["python3", "desk_alert.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "desk_alert.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "desk_alert.py"]

[[events]]
on = "workspace.moved"
command = ["python3", "desk_alert.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "desk_alert.py"]
