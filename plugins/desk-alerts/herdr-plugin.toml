id = "herdr-voice.desk-alerts"
name = "Desk alerts"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Tell Hermes when an agent finishes or stops on a question while you're away."
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.closed"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.exited"
command = ["python3", "desk_alert.py"]

[[events]]
on = "pane.moved"
command = ["python3", "desk_alert.py"]
